name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        shell: cmd
        run: call build_windows.bat
      - name: Package Windows download
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'RGBControl'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item RGBControl.exe, install_service.bat, uninstall_service.bat, INSTALL.txt, LICENSE -Destination $package
          Compress-Archive -Path $package -DestinationPath RGBControl-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RGBControl-Windows
          path: RGBControl-Windows.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RGBControl-Windows
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/RGBControl-Windows.zip --verify-tag --generate-notes
          elif ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 dist/RGBControl-Windows.zip --target "$GITHUB_SHA" --generate-notes
          fi
