name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        shell: cmd
        run: call build_windows.bat
      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw 'Inno Setup 6 compiler was not found on the Windows runner.' }
          & $iscc RGBControl.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'dist\RGBControl-Setup-0.2.4.exe')) { throw 'Installer executable was not created.' }
      - name: Verify embedded icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          function Assert-ColorfulIcon([string] $path) {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $path).Path)
            if (-not $icon) { throw "No icon found in $path" }
            try {
              $bitmap = $icon.ToBitmap()
              try {
                $red = $green = $blue = 0
                for ($y = 0; $y -lt $bitmap.Height; $y++) {
                  for ($x = 0; $x -lt $bitmap.Width; $x++) {
                    $pixel = $bitmap.GetPixel($x, $y)
                    if ($pixel.R -gt ($pixel.G + 50) -and $pixel.R -gt ($pixel.B + 50)) { $red++ }
                    if ($pixel.G -gt ($pixel.R + 30) -and $pixel.G -gt ($pixel.B + 10)) { $green++ }
                    if ($pixel.B -gt ($pixel.R + 50) -and $pixel.B -gt ($pixel.G + 15)) { $blue++ }
                  }
                }
                if ($red -lt 2 -or $green -lt 2 -or $blue -lt 2) {
                  throw "The RGB icon is missing from $path"
                }
              } finally { $bitmap.Dispose() }
            } finally { $icon.Dispose() }
          }
          Assert-ColorfulIcon 'RGBControl.exe'
          Assert-ColorfulIcon 'dist\RGBControl-Setup-0.2.4.exe'
      - name: Verify service and app-only installation
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\RGBControl-Setup-0.2.4.exe').Path
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\RGB Control.lnk'
          $desktop = Join-Path $env:PUBLIC 'Desktop\RGB Control.lnk'
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          function Run-Setup([string[]] $options) {
            $process = Start-Process -FilePath $setup -ArgumentList $options -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          }
          function Run-Uninstall {
            $uninstaller = Get-ChildItem (Join-Path $env:ProgramFiles 'RGBControl\unins*.exe') | Select-Object -First 1
            if (-not $uninstaller) { throw 'Uninstaller was not registered.' }
            $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
            for ($i = 0; $i -lt 30 -and (Get-Service RGBControlService -ErrorAction SilentlyContinue); $i++) {
              Start-Sleep -Milliseconds 500
            }
            if (Get-Service RGBControlService -ErrorAction SilentlyContinue) { throw 'Service remained after uninstall.' }
          }
          Run-Setup -options @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=service')
          if ((Get-Service RGBControlService).Status -ne 'Running') { throw 'Service did not start.' }
          if (-not (Test-Path $startMenu)) { throw 'Start menu shortcut is missing.' }
          if (Test-Path $desktop) { throw 'Desktop shortcut was created without opt-in.' }
          if (-not (Get-ItemProperty $uninstallKey | Where-Object DisplayName -eq 'RGBControl')) { throw 'Windows uninstall entry is missing.' }
          Run-Uninstall
          Run-Setup -options @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon')
          if (Get-Service RGBControlService -ErrorAction SilentlyContinue) { throw 'App-only install created a service.' }
          if (-not (Test-Path $startMenu)) { throw 'App-only Start menu shortcut is missing.' }
          if (-not (Test-Path $desktop)) { throw 'Opt-in desktop shortcut is missing.' }
          if (-not (Get-ItemProperty $uninstallKey | Where-Object DisplayName -eq 'RGBControl')) { throw 'App-only uninstall entry is missing.' }
          Run-Uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: RGBControl-Setup-0.2.4
          path: dist/RGBControl-Setup-0.2.4.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RGBControl-Setup-0.2.4
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/RGBControl-Setup-0.2.4.exe --verify-tag --generate-notes
          elif ! gh release view v0.2.4 >/dev/null 2>&1; then
            gh release create v0.2.4 dist/RGBControl-Setup-0.2.4.exe --target "$GITHUB_SHA" --generate-notes
          fi
